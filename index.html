<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectre Units</title>
<style>
  :root{
    --ink:#070b0e; --text:#e9efec; --sub:#839197; --gold:#b8c6c9; --hair:#29343a;
    --mono:"SF Mono","Consolas",ui-monospace,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden;}
  body{ background:var(--ink); color:var(--text);
        font-family:"Hiragino Sans","Yu Gothic UI",sans-serif; }
  #wrap{position:fixed; inset:0; perspective:1100px; overflow:hidden;}
  #cv{position:absolute; inset:-25%; width:150%; height:150%;
         touch-action:none; cursor:grab; will-change:transform,filter;
         transition:filter .28s linear;}
  #cv.title-grade,#cv.paper-grade{
    filter:blur(var(--grade-blur,4.5px)) saturate(var(--grade-sat,.62))
           contrast(var(--grade-contrast,1.05)) brightness(var(--grade-brightness,1.10));
  }
  #cv.dragging{cursor:grabbing;}

  /* tilt-shift + vignette, GPU composited */
  #tilt{
    position:absolute; inset:0; pointer-events:none;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    mask-image: linear-gradient(to bottom, black 0%, transparent 17%, transparent 83%, black 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 17%, transparent 83%, black 100%);
  }
  #light{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:soft-light;
    opacity:.08;
    background:radial-gradient(ellipse 122% 108% at 34% 24%,rgba(214,226,221,.22),rgba(0,0,0,0) 72%);
  }
  #vig{
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 125% 96% at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.12) 64%, rgba(0,0,0,.72) 100%),
      linear-gradient(to bottom, rgba(3,6,8,.58), rgba(0,0,0,0) 17%),
      linear-gradient(to top, rgba(3,6,8,.68), rgba(0,0,0,0) 18%);
  }
  #titleBackdrop{
    position:absolute; left:50%; top:50%; width:min(78vw,1060px); height:min(43vh,360px);
    transform:translate(-50%,-50%); pointer-events:none;
    backdrop-filter:blur(1.4px) saturate(.90) brightness(1.01);
    -webkit-backdrop-filter:blur(1.4px) saturate(.90) brightness(1.01);
    mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,black 0 32%,rgba(0,0,0,.78) 48%,transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 50%,black 0 32%,rgba(0,0,0,.78) 48%,transparent 78%);
    opacity:1; transition:none;
  }
  #titleWord{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    pointer-events:none; user-select:none; white-space:nowrap;
    font:600 min(8.6vw,8.6vh,78px)/1 "Bahnschrift SemiCondensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
    letter-spacing:.18em; color:transparent;
    filter:none; text-shadow:none;
    opacity:1; transition:opacity .46s cubic-bezier(.22,.61,.36,1);
  }
  #titleWord::before{
    content:none;
  }
  #titleFx{
    position:absolute; inset:0; width:100%; height:100%; pointer-events:none;
    mix-blend-mode:screen;
    filter:drop-shadow(0 0 4px rgba(255,253,248,.42)) drop-shadow(0 0 9px rgba(246,241,231,.20));
    opacity:1; transition:none;
  }
  #mark{ opacity:0; position:absolute; top:20px; left:24px; pointer-events:none; user-select:none; transition:opacity .8s; }
  #mark .t{ font-family:var(--mono); font-size:12px; letter-spacing:.34em; color:var(--text); }
  #mark .d{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--text);
            margin-top:5px; min-width:10ch; font-variant-numeric:tabular-nums; }
  #ctrl{
    opacity:0; pointer-events:none;
    position:absolute; right:20px; top:18px; display:flex; align-items:center;
    padding:10px 14px 10px 15px; border:none; border-radius:16px;
    background:linear-gradient(135deg,rgba(252,255,253,.27),rgba(235,244,242,.16));
    box-shadow:0 0 16px rgba(242,255,253,.27),0 0 32px rgba(216,238,238,.13),0 9px 28px rgba(4,8,10,.14);
    backdrop-filter:blur(15px) saturate(1.22); -webkit-backdrop-filter:blur(15px) saturate(1.22);
    transition:opacity .42s ease;
  }
  .sw{ display:flex; gap:18px; align-items:center; }
  .sw button{
    width:23px; height:23px; flex:0 0 auto; border-radius:50%; border:1px solid rgba(255,255,255,.52);
    cursor:pointer; padding:0; transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  }
  .sw button:hover{ transform:scale(1.25); }
  .sw button.on{ outline:2px solid var(--gold); outline-offset:2px; }
  .sw button[data-v="four"]{
    border:1px solid rgba(246,255,255,.96);
    box-shadow:0 0 5px rgba(245,255,255,.90),0 0 12px rgba(190,232,240,.60);
  }
  .sw button[data-v="four"].on{ outline:none; }
  .sw button.lamp{ width:24px; height:29px; border:none; border-radius:0; background:none !important; display:flex; align-items:center; justify-content:center; }
  .sw button.lamp.on{ outline:none; }
  .sw button.lamp svg{ overflow:visible; transition:filter .3s; }
  .sw button.lamp path{ transition:fill .3s,opacity .3s; }
  .divider{ width:1px; height:18px; background:var(--hair); }
  #btnPal,#btnReset{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.18em;
    background:transparent; color:var(--sub); border:1px solid var(--hair);
    border-radius:2px; padding:5px 9px; cursor:pointer; transition:all .25s;
  }
  #btnPal:hover,#btnReset:hover{ color:var(--ink); background:var(--gold); border-color:var(--gold); }
  #hint{
    white-space:nowrap; font-size:clamp(8px,2.4vw,10.5px);
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    pointer-events:none; font-family:var(--mono);
    letter-spacing:.3em; color:var(--text);
    transition:opacity .8s;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.72;} 50%{opacity:1;} }
  #hint.quiet{ animation:none; opacity:.82; }
  #boot{ position:absolute; inset:0; background:#070b0e; z-index:99;
         pointer-events:none; opacity:1;
         transition:opacity 2.1s cubic-bezier(.33,0,.25,1); }
  @media (prefers-reduced-motion: reduce){ #hint{animation:none;} }
</style>
</head>

</div>

/* ================= substitution tree (implicit, infinite-ish) ================= */
const S3=Math.sqrt(3);
const PTS=[[0,0],[1,0],[1.5,-S3/2],[1.5+S3/2,0.5-S3/2],[1.5+S3/2,1.5-S3/2],
 [2.5+S3/2,1.5-S3/2],[3+S3/2,1.5],[3,2],[3-S3/2,1.5],[2.5-S3/2,1.5+S3/2],
 [1.5-S3/2,1.5+S3/2],[0.5-S3/2,1.5+S3/2],[-S3/2,1.5],[0,1]];
const CENTROID=[1.45,0.95];
let TILE_R=0;
for(const p of PTS) TILE_R=Math.max(TILE_R,Math.hypot(p[0]-CENTROID[0],p[1]-CENTROID[1]));
const TILE_AREA=8.19615;
const ID=[1,0,0,0,1,0];
const LABELS=["Gamma","Delta","Theta","Lambda","Xi","Pi","Sigma","Phi","Psi"];
function mul(A,B){return[A[0]*B[0]+A[1]*B[3],A[0]*B[1]+A[1]*B[4],A[0]*B[2]+A[1]*B[5]+A[2],
 A[3]*B[0]+A[4]*B[3],A[3]*B[1]+A[4]*B[4],A[3]*B[2]+A[4]*B[5]+A[5]];}
function trot(a){const c=Math.cos(a),s=Math.sin(a);return[c,-s,0,s,c,0];}
function ttrans(x,y){return[1,0,x,0,1,y];}
function transPt(M,p){return[M[0]*p[0]+M[1]*p[1]+M[2],M[3]*p[0]+M[4]*p[1]+M[5]];}
function transTo(p,q){return ttrans(q[0]-p[0],q[1]-p[1]);}
function buildBase(){
  const sys={};
  for(const l of LABELS) if(l!=="Gamma")
    sys[l]={tile:true,label:l,quad:[PTS[3],PTS[5],PTS[7],PTS[11]]};
  sys["Gamma"]={tile:false,base:true,quad:[PTS[3],PTS[5],PTS[7],PTS[11]],geoms:[
    [{tile:true,label:"Gamma1"},ID],
    [{tile:true,label:"Gamma2"},mul(ttrans(PTS[8][0],PTS[8][1]),trot(Math.PI/6))]]};
  return sys;
}
function buildSupertiles(sys){
  const quad=sys["Delta"].quad;
  const R=[-1,0,0,0,1,0];
  const rules=[[60,3,1],[0,2,0],[60,3,1],[60,3,1],[0,2,0],[60,3,1],[-120,3,3]];
  let Ts=[ID],tot=0,rot=ID,tq=quad.slice();
  for(const [ang,from,to] of rules){
    if(ang!==0){tot+=ang;rot=trot(tot*Math.PI/180);tq=quad.map(p=>transPt(rot,p));}
    Ts.push(mul(transTo(tq[to],transPt(Ts[Ts.length-1],quad[from])),rot));
  }
  Ts=Ts.map(T=>mul(R,T));
  const SR={
   "Gamma":["Pi","Delta",null,"Theta","Sigma","Xi","Phi","Gamma"],
   "Delta":["Xi","Delta","Xi","Phi","Sigma","Pi","Phi","Gamma"],
   "Theta":["Psi","Delta","Pi","Phi","Sigma","Pi","Phi","Gamma"],
   "Lambda":["Psi","Delta","Xi","Phi","Sigma","Pi","Phi","Gamma"],
   "Xi":["Psi","Delta","Pi","Phi","Sigma","Psi","Phi","Gamma"],
   "Pi":["Psi","Delta","Xi","Phi","Sigma","Psi","Phi","Gamma"],
   "Sigma":["Xi","Delta","Xi","Phi","Sigma","Pi","Lambda","Gamma"],
   "Phi":["Psi","Delta","Psi","Phi","Sigma","Pi","Phi","Gamma"],
   "Psi":["Psi","Delta","Psi","Phi","Sigma","Psi","Phi","Gamma"]};
  const sq=[transPt(Ts[6],quad[2]),transPt(Ts[5],quad[1]),transPt(Ts[3],quad[2]),transPt(Ts[0],quad[1])];
  const out={};
  for(const [label,subs] of Object.entries(SR)){
    const geoms=[];
    for(let i=0;i<subs.length;i++) if(subs[i]) geoms.push([sys[subs[i]],Ts[i]]);
    out[label]={tile:false,quad:sq,geoms};
  }
  out.__Ts=Ts;
  return out;
}
const DEPTH=11;
const LEV=[buildBase()];
for(let d=1;d<=DEPTH;d++) LEV.push(buildSupertiles(LEV[d-1]));
const ROOT=LEV[DEPTH]["Delta"];
/* per-depth bounding discs (center m, radius r) */
const MB=[CENTROID.slice()], RB=[TILE_R*1.6];
for(let d=1;d<=DEPTH;d++){
  const Ts=LEV[d].__Ts;
  const pts=Ts.map(T=>transPt(T,MB[d-1]));
  const m=[pts.reduce((a,p)=>a+p[0],0)/pts.length, pts.reduce((a,p)=>a+p[1],0)/pts.length];
  let r=0;
  for(const p of pts) r=Math.max(r,Math.hypot(p[0]-m[0],p[1]-m[1])+RB[d-1]);
  MB.push(m); RB.push(r*1.02);
}
const WORLD_C=transPt(ID,MB[DEPTH]);
/* walkers */
function walkView(fn, testDisc){
  // testDisc(mx,my,r) -> bool visible
  (function rec(node,T,d,key){
    const m=transPt(T,MB[d]);
    if(!testDisc(m[0],m[1],RB[d])) return;
    if(node.tile){ fn(key,T,node.label); return; }
    const cd=(d===0)?0:d-1;
    const g=node.geoms;
    for(let i=0;i<g.length;i++)
      rec(g[i][0],mul(T,g[i][1]),cd,key+"."+i);
  })(ROOT,ID,DEPTH,"r");
}
function walkRadius(cx,cy,R,fn){
  walkView(fn,(mx,my,r)=>Math.hypot(mx-cx,my-cy)<=R+r);
}
function leafAt(px,py){
  let hit=null;
  (function rec(node,T,d,key){
    if(hit) return;
    const m=transPt(T,MB[d]);
    if(Math.hypot(m[0]-px,m[1]-py)>RB[d]) return;
    if(node.tile){
      const M=T, det=M[0]*M[4]-M[1]*M[3];
      const dx=px-M[2], dy=py-M[5];
      const lp=[(M[4]*dx-M[1]*dy)/det,(-M[3]*dx+M[0]*dy)/det];
      if(inTile(lp)) hit={key,T,label:node.label,cx:m[0],cy:m[1]};
      return;
    }
    const cd=(d===0)?0:d-1;
    const g=node.geoms;
    for(let i=0;i<g.length;i++) rec(g[i][0],mul(T,g[i][1]),cd,key+"."+i);
  })(ROOT,ID,DEPTH,"r");
  return hit;
}
function inTile(p){
  let c=false;
  for(let i=0,j=13;i<14;j=i++){
    const a=PTS[i],b=PTS[j];
    if((a[1]>p[1])!==(b[1]>p[1]) &&
       p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]) c=!c;
  }
  return c;
}
/* ================= fold: baked 3D sim + press-flat ================= */
function angOf(T){ return Math.atan2(T[3], FLIPV*T[0]); }
/* square paper helpers: center + corner pair for upright alignment */
let PAPER_C=[0,0], SQ_A=0, SQ_B=1, SQ_HALF=2;
function initPaperGeom(){
  const f0=FOLDD.frames[0];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const p of f0){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
  PAPER_C=[(x0+x1)/2,(y0+y1)/2];
  SQ_HALF=Math.max(x1-x0,y1-y0)/2;
  const cx=PAPER_C[0], cy=PAPER_C[1];
  // farthest vertex from center = a square corner; its nearest far vertex along hull = adjacent corner
  let a=0,da=0;
  f0.forEach((p,i)=>{const d=Math.hypot(p[0]-cx,p[1]-cy); if(d>da){da=d;a=i;}});
  // adjacent corner: vertex maximizing distance from center among those ~90 deg away
  let b=-1,db=0;
  const angA=Math.atan2(f0[a][1]-cy,f0[a][0]-cx);
  f0.forEach((p,i)=>{
    if(i===a)return;
    const d=Math.hypot(p[0]-cx,p[1]-cy);
    const ang=Math.atan2(p[1]-cy,p[0]-cx);
    let dd=Math.abs(wrapA(ang-angA));
    if(Math.abs(dd-Math.PI/2)<0.2 && d>db){db=d;b=i;}
  });
  SQ_A=a; SQ_B=(b<0?(a+1)%f0.length:b);
}
function paperCenter(T){ return transPt(T,PAPER_C); }
function paperRoll(T){
  const f0=FOLDD.frames[0];
  const dx=f0[SQ_B][0]-f0[SQ_A][0], dy=f0[SQ_B][1]-f0[SQ_A][1];
  function edgeAng(r){
    const c=Math.cos(r), si=Math.sin(r), f=FLIPV;
    const A=[c*f,-si,0, si*f,c,0];
    const B=mul(A,T);
    return Math.atan2(B[3]*dx+B[4]*dy, B[0]*dx+B[1]*dy);
  }
  const snap=e=>e-Math.round(e/(Math.PI/2))*(Math.PI/2); // minimal turn to axis-aligned
  let r=0;
  for(let i=0;i<4;i++){
    const e=snap(edgeAng(r));
    if(Math.abs(e)<1e-4) break;
    const r1=wrapA(r-e);
    r = Math.abs(snap(edgeAng(r1)))<=Math.abs(e) ? r1 : wrapA(r+e);
  }

  nextPalette();                              // palette changes never cancel Mystic
  beginColorTransition(fromMode,fromPal);
  refreshSwatches();
});
btnMys.addEventListener("click",()=>{
  const fromMode=colorMode,fromPal=FOUR_PAL.slice();
  colorMode=(colorMode==="mystic")?"four":"mystic";
  beginColorTransition(fromMode,fromPal);
  refreshSwatches();
});
refreshSwatches();
function resize(){
  const r=cv.parentElement.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.round(r.width*1.50); H=Math.round(r.height*1.50);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  rebuildTitleFx();
}
window.addEventListener("resize",resize);
resize();
(function(){
  let leaf=null;
  for(let r=0;!leaf&&r<6;r++){
    leaf=leafAt(WORLD_C[0]+r*0.7,WORLD_C[1]+r*0.4);
  }
  REF_ANG=angOf(leaf.T);
  bakeFold();
  initPaperGeom();
  paperAt(leaf,false);
})();
requestAnimationFrame(frame);

</script>
